enum UserRole {
  USER
  ADMIN
}

type User {
  id: ID!
  name: String!
  email: String!
  role: UserRole!
  avatarUrl: String
  bio: String
}

extend type Query {
  """Lista todos os usuários. Exige ADMIN."""
  users: [User!]!
}

extend type Mutation {
  """Altera a role de um usuário. Exige ADMIN; não permite auto-rebaixamento."""
  updateUserRole(id: ID!, role: UserRole!): User!
}
