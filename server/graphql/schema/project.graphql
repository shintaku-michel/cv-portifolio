enum ProjectStatus {
  DRAFT
  PUBLISHED
}

type Project {
  id: ID!
  title: String!
  slug: String!
  shortDescription: String!
  description: String!
  coverImage: String
  gallery: [String!]!
  status: ProjectStatus!
  featured: Boolean!
  displayOrder: Int!
  demoUrl: String
  repositoryUrl: String
  startDate: String
  endDate: String
  technologies: [Technology!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateProjectInput {
  title: String!
  slug: String!
  shortDescription: String!
  description: String!
  coverImage: String
  gallery: [String!]
  demoUrl: String
  repositoryUrl: String
  startDate: String
  endDate: String
  featured: Boolean
  displayOrder: Int
  technologyIds: [ID!]
}

input UpdateProjectInput {
  title: String
  slug: String
  shortDescription: String
  description: String
  coverImage: String
  gallery: [String!]
  demoUrl: String
  repositoryUrl: String
  startDate: String
  endDate: String
  featured: Boolean
  displayOrder: Int
  technologyIds: [ID!]
}

extend type Query {
  """Projetos publicados; ADMIN autenticado também vê rascunhos."""
  projects: [Project!]!
  """Busca por slug. Retorna null se DRAFT e o chamador não for ADMIN."""
  project(slug: String!): Project
  featuredProjects: [Project!]!
}

extend type Mutation {
  createProject(input: CreateProjectInput!): Project!
  updateProject(id: ID!, input: UpdateProjectInput!): Project!
  publishProject(id: ID!): Project!
  unpublishProject(id: ID!): Project!
  deleteProject(id: ID!): Boolean!
}
