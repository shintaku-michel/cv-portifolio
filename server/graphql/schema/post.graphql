enum PostStatus {
  DRAFT
  PUBLISHED
}

type Tag {
  id: ID!
  name: String!
  slug: String!
}

type Post {
  id: ID!
  title: String!
  slug: String!
  excerpt: String!
  content: String!
  coverImage: String
  status: PostStatus!
  author: User!
  category: Category
  tags: [Tag!]!
  displayOrder: Int!
  publishedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreatePostInput {
  title: String!
  slug: String!
  excerpt: String!
  content: String!
  coverImage: String
  categoryId: ID
  displayOrder: Int
  tagIds: [ID!]
}

input UpdatePostInput {
  title: String
  slug: String
  excerpt: String
  content: String
  coverImage: String
  categoryId: ID
  displayOrder: Int
  tagIds: [ID!]
}

extend type Query {
  tags: [Tag!]!
  """Posts publicados; ADMIN autenticado também vê rascunhos."""
  posts: [Post!]!
  """Busca por slug. Retorna null se DRAFT e o chamador não for ADMIN."""
  post(slug: String!): Post
  """Busca por ID, para o formulário de edição do admin. Exige ADMIN."""
  postById(id: ID!): Post
  """Não há campo `featured` no modelo — retorna os publicados mais recentes."""
  featuredPosts: [Post!]!
}

extend type Mutation {
  createPost(input: CreatePostInput!): Post!
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  publishPost(id: ID!): Post!
  unpublishPost(id: ID!): Post!
  deletePost(id: ID!): Boolean!
}
