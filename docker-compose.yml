services:
  postgres:
    image: postgres:17-alpine
    container_name: portfolio-cms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio_cms
    ports:
      - '5432:5432'
    volumes:
      - portfolio_cms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d portfolio_cms']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  portfolio_cms_pgdata:
